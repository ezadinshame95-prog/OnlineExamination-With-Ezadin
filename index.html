<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Examination System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

/* TOP BAR */
.topbar {
    height: 108px;
    background: #252a2d;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 15px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.title {
    flex: 1;
    height: 70px;
    background: #303538;
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: cursive;
    font-size: 27px;
}

.refresh {
    font-size: 42px;
}

.menu {
    font-size: 38px;
}

/* PAGE */
.page {
    max-width: 760px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 70px;
    border-radius: 35px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

/* LOGIN */
.login-title {
    text-align: center;
    font-size: 55px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    font-size: 29px;
    margin-bottom: 60px;
}

input {
    width: 100%;
    height: 85px;
    margin-bottom: 35px;
    padding: 0 25px;
    border: 2px solid #ccc;
    border-radius: 17px;
    font-size: 24px;
}

button {
    border: none;
    border-radius: 15px;
    background: #2864df;
    color: white;
    font-size: 23px;
    font-weight: bold;
    padding: 20px;
    cursor: pointer;
}

.login-button {
    width: 100%;
}

.message {
    text-align: center;
    font-size: 18px;
}

/* SUBJECT */
.subject-title {
    text-align: center;
    font-size: 42px;
}

.choose {
    text-align: center;
    color: #666;
    font-size: 23px;
    margin-bottom: 35px;
}

.subject {
    border: 3px solid #ddd;
    border-radius: 18px;
    padding: 25px;
    margin: 18px 0;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

.subject:hover {
    border-color: #2864df;
    background: #f3f6ff;
}

/* EXAM */
.exam-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.exam-header h2 {
    margin: 0;
}

.timer {
    background: #e53935;
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

.progress {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2864df;
}

.question-number {
    color: #666;
    margin-top: 25px;
}

.question {
    font-size: 24px;
    font-weight: bold;
    line-height: 1.5;
    margin: 25px 0;
}

.option {
    display: block;
    border: 2px solid #ddd;
    border-radius: 14px;
    padding: 18px;
    margin: 14px 0;
    font-size: 19px;
    cursor: pointer;
}

.option:hover {
    background: #f2f5ff;
    border-color: #2864df;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 30px;
}

.previous {
    background: #777;
}

.submit {
    background: #16a34a;
}

/* RESULT */
.result {
    text-align: center;
}

.result h1 {
    font-size: 42px;
}

.score {
    font-size: 65px;
    font-weight: bold;
    color: #2864df;
    margin: 25px;
}

.result-text {
    font-size: 22px;
}

.hidden {
    display: none;
}

/* MOBILE */
@media(max-width:600px) {

    .topbar {
        height: 85px;
        padding: 0 12px;
    }

    .title {
        height: 58px;
        font-size: 19px;
    }

    .logo {
        font-size: 26px;
    }

    .refresh {
        font-size: 32px;
    }

    .menu {
        font-size: 30px;
    }

    .page {
        margin: 20px auto;
        padding: 10px;
    }

    .card {
        padding: 45px 25px;
        border-radius: 30px;
    }

    .login-title {
        font-size: 42px;
    }

    .subtitle {
        font-size: 23px;
    }

    input {
        height: 70px;
        font-size: 19px;
    }

    .subject-title {
        font-size: 34px;
    }

    .subject {
        font-size: 20px;
    }

    .question {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

    <div class="logo">&lt;/&gt;</div>

    <div class="title">
        Online Examination System
    </div>

    <div class="refresh">↻</div>

    <div class="menu">⋮</div>

</div>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="page">

    <div class="card">

        <h1 class="login-title">
            Online Exam
        </h1>

        <p class="subtitle">
            Student Login
        </p>

        <input
            type="text"
            id="username"
            placeholder="Enter Username">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button
            class="login-button"
            onclick="login()">
            LOGIN
        </button>

        <p
            id="loginMessage"
            class="message">
        </p>

    </div>

</div>


<!-- ================= SUBJECT ================= -->

<div id="subjectPage" class="page hidden">

    <div class="card">

        <h1 class="subject-title">
            Select Subject
        </h1>

        <p class="choose">
            Choose the subject you want to practice.
        </p>

        <div
            class="subject"
            onclick="startExam('Maths')">
            📐 Maths
        </div>

        <div
            class="subject"
            onclick="startExam('Physics')">
            ⚡ Physics
        </div>

        <div
            class="subject"
            onclick="startExam('Chemistry')">
            🧪 Chemistry
        </div>

        <div
            class="subject"
            onclick="startExam('Biology')">
            🧬 Biology
        </div>

        <div
            class="subject"
            onclick="startExam('English')">
            📖 English
        </div>

        <div
            class="subject"
            onclick="startExam('Aptitude')">
            🧠 Aptitude
        </div>

    </div>

</div>


<!-- ================= EXAM ================= -->

<div id="examPage" class="page hidden">

    <div class="card">

        <div class="exam-header">

            <h2 id="subjectName">
                Maths
            </h2>

            <div class="timer">
                ⏲️ <span id="time">
                    05:00
                </span>
            </div>

        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar">
            </div>
        </div>

        <p
            id="questionNumber"
            class="question-number">
        </p>

        <div
            id="question"
            class="question">
        </div>

        <div id="options"></div>

        <div class="navigation">

            <button
                class="previous"
                id="previousButton"
                onclick="previousQuestion()">
                ← Previous
            </button>

            <button
                id="nextButton"
                onclick="nextQuestion()">
                Next →
            </button>

            <button
                class="submit hidden"
                id="submitButton"
                onclick="submitExam()">
                Submit
            </button>

        </div>

    </div>

</div>


<!-- ================= RESULT ================= -->

<div id="resultPage" class="page hidden">

    <div class="card result">

        <h1>
            Exam Result 🎉
        </h1>

        <p class="result-text">
            Your Score
        </p>

        <div
            id="score"
            class="score">
        </div>

        <p
            id="percentage"
            class="result-text">
        </p>

        <p
            id="resultMessage"
            class="result-text">
        </p>

        <button onclick="backToSubjects()">
            Choose Another Subject
        </button>

    </div>

</div>


<script>

/* ================= QUESTIONS ================= */

const questionBank = {

    Maths: [
        {
            question: "What is 5 × 6?",
            options: ["20", "25", "30", "35"],
            answer: 2
        },
        {
            question: "What is the square root of 81?",
            options: ["7", "8", "9", "10"],
            answer: 2
        },
        {
            question: "If x + 5 = 12, what is x?",
            options: ["5", "6", "7", "8"],
            answer: 2
        },
        {
            question: "What is 25% of 200?",
            options: ["25", "40", "50", "75"],
            answer: 2
        }
    ],

    Physics: [
        {
            question: "What is the SI unit of force?",
            options: [
                "Joule",
                "Newton",
                "Watt",
                "Pascal"
            ],
            answer: 1
        },
        {
            question: "Which quantity has both magnitude and direction?",
            options: [
                "Mass",
                "Time",
                "Velocity",
                "Temperature"
            ],
            answer: 2
        }
    ],

    Chemistry: [
        {
            question: "What is the chemical symbol for oxygen?",
            options: [
                "O",
                "Ox",
                "C",
                "H"
            ],
            answer: 0
        },
        {
            question: "What is the pH of pure water?",
            options: [
                "0",
                "5",
                "7",
                "14"
            ],
            answer: 2
        }
    ],

    Biology: [
        {
            question: "Which organ pumps blood around the body?",
            options: [
                "Lung",
                "Brain",
                "Heart",
                "Kidney"
            ],
            answer: 2
        },
        {
            question: "The basic unit of life is:",
            options: [
                "Tissue",
                "Organ",
                "Cell",
                "Atom"
            ],
            answer: 2
        }
    ],

    English: [
        {
            question: "Choose the correct sentence.",
            options: [
                "He go to school.",
                "He goes to school.",
                "He going school.",
                "He gone school."
            ],
            answer: 1
        },
        {
            question: "What is the opposite of 'hot'?",
            options: [
                "Warm",
                "Cold",
                "Big",
                "Fast"
            ],
            answer: 1
        }
    ],

    Aptitude: [
        {
            question: "What comes next? 2, 4, 6, 8, ?",
            options: [
                "9",
                "10",
                "11",
                "12"
            ],
            answer: 1
        },
        {
            question: "Find the odd one out.",
            options: [
                "Apple",
                "Mango",
                "Banana",
                "Carrot"
            ],
            answer: 3
        }
    ]

};


/* ================= VARIABLES ================= */

let currentSubject = "";

let questions = [];

let currentQuestion = 0;

let userAnswers = [];

let timeLeft = 300;

let timer;


/* ================= LOGIN ================= */

function login() {

    let username =
        document.getElementById("username").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let message =
        document.getElementById("loginMessage");

    if (
        username === "" ||
        password === ""
    ) {

        message.innerHTML =
            "Please fill in all fields.";

        message.style.color = "red";

        return;
    }

    /*
       LOGIN booda
       Subject page banama
    */

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("subjectPage")
        .classList.remove("hidden");
}


/* ================= START EXAM ================= */

function startExam(subject) {

    currentSubject = subject;

    questions = questionBank[subject];

    currentQuestion = 0;

    userAnswers =
        new Array(questions.length).fill(null);

    timeLeft = 300;

    document.getElementById("subjectPage")
        .classList.add("hidden");

    document.getElementById("examPage")
        .classList.remove("hidden");

    document.getElementById("subjectName")
        .innerHTML = subject;

    startTimer();

    showQuestion();
}


/* ================= SHOW QUESTION ================= */

function showQuestion() {

    let q = questions[currentQuestion];

    document.getElementById("questionNumber")
        .innerHTML =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question")
        .innerHTML = q.question;

    let options =
        document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach(function(option, index) {

        let label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${
                    userAnswers[currentQuestion] === index
                    ? "checked"
                    : ""
                }>
            ${option}
        `;

        label.querySelector("input")
            .addEventListener(
                "change",
                function() {

                    userAnswers[currentQuestion] =
                        Number(this.value);

                }
            );

        options.appendChild(label);

    });


    /* Progress */

    let progress =
        ((currentQuestion + 1) /
        questions.length) * 100;

    document.getElementById("progressBar")
        .style.width =
        progress + "%";


    /* Previous */

    document.getElementById("previousButton")
        .style.display =
        currentQuestion === 0
        ? "none"
        : "block";


    /* Next / Submit */

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        document.getElementById("nextButton")
            .classList.add("hidden");

        document.getElementById("submitButton")
            .classList.remove("hidden");

    } else {

        document.getElementById("nextButton")
            .classList.remove("hidden");

        document.getElementById("submitButton")
            .classList.add("hidden");
    }
}


/* ================= NEXT ================= */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();
    }
}


/* ================= PREVIOUS ================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();
    }
}


/* ================= TIMER ================= */

function startTimer() {

    clearInterval(timer);

    timer =
        setInterval(function() {

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            document.getElementById("time")
                .innerHTML =
                String(minutes).padStart(2, "0")
                + ":" +
                String(seconds).padStart(2, "0");

            timeLeft--;

            if (timeLeft < 0) {

                clearInterval(timer);

                submitExam();
            }

        }, 1000);
}


/* ================= SUBMIT ================= */

function submitExam() {

    clearInterval(timer);

    let score = 0;

    questions.forEach(
        function(q, index) {

            if (
                userAnswers[index] ===
                q.answer
            ) {

                score++;
            }
        }
    );

    let percentage =
        (score / questions.length) * 100;

    document.getElementById("examPage")
        .classList.add("hidden");

    document.getElementById("resultPage")
        .classList.remove("hidden");

    document.getElementById("score")
        .innerHTML =
        score + " / " +
        questions.length;

    document.getElementById("percentage")
        .innerHTML =
        "Percentage: " +
        percentage + "%";

    document.getElementById("resultMessage")
        .innerHTML =
        "Subject: " +
        currentSubject +
        "<br><br>" +
        "Keep practicing! 📚";
}


/* ================= BACK ================= */

function backToSubjects() {

    clearInterval(timer);

    document.getElementById("resultPage")
        .classList.add("hidden");

    document.getElementById("subjectPage")
        .classList.remove("hidden");
}

</script>

</body>
  </html>
